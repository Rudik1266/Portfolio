<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loopstack</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap');
    @import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #000; }
    body { background-color: #000000; min-height: 100vh; min-height: 100dvh; overflow: hidden; position: relative; color: #fff; }
    #top-gradient { position: fixed; top: -30vh; left: 0; width: 100vw; height: auto; display: block; z-index: 0; pointer-events: none; }
    .hero-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 6vh; width: 95%; max-width: 1100px; margin: 0 auto; }
    .hero-title { font-family: 'Playfair Display', Georgia, serif; font-size: 2.8rem; font-weight: 400; color: #fff; line-height: 1.15; margin-bottom: 2.2rem; letter-spacing: -.015em; text-shadow: 0 4px 30px rgba(0,0,0,.5); }
    .hero-btn { font-family: Outfit, sans-serif; font-size: 1.1rem; font-weight: 500; letter-spacing: .02em; color: #fff; background: #000; border: 1px solid rgba(255,255,255,.18); padding: 1.3rem 2.5rem; min-height: 52px; border-radius: 9999px; display: inline-flex; align-items: center; gap: .9rem; cursor: pointer; touch-action: manipulation; transition: all .3s cubic-bezier(.16,1,.3,1); box-shadow: 0 4px 25px rgba(0,0,0,.4); outline: none; }
    .hero-btn:hover { background: #fff; color: #000; border-color: #fff; transform: translateY(-2px); box-shadow: 0 6px 30px rgba(0,0,0,.3); }
    .hero-btn:active { transform: translateY(0); }
    .hero-btn:focus-visible, .footer-link:focus-visible, .social-icon:focus-visible { outline: 2px solid #39FF14; outline-offset: 5px; }
    .blinking-dot { width: 10px; height: 10px; background: #39FF14; border-radius: 50%; position: relative; display: inline-block; animation: pulse-glow 2s infinite ease-in-out; }
    .blinking-dot::after { content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px; background: rgba(57,255,20,.45); border-radius: 50%; animation: wave-expand 2s infinite ease-in-out; }
    @keyframes pulse-glow { 0%,100% { opacity:.5; transform:scale(.85); box-shadow:0 0 4px rgba(57,255,20,.3); } 50% { opacity:1; transform:scale(1.1); box-shadow:0 0 12px rgba(57,255,20,.9); } }
    @keyframes wave-expand { 0% { transform:scale(.6); opacity:.9; } 100% { transform:scale(2.3); opacity:0; } }
    .footer-container { position: fixed; top: 50vh; left: 20px; right: 20px; width: calc(100vw - 40px); transform: translateY(-50%); z-index: 3; display: flex; flex-direction: column; }
    .footer-top { display:flex; justify-content:space-between; align-items:flex-end; width:100%; padding:0 5px; }
    .footer-title { font-family:'General Sans',-apple-system,sans-serif; font-size:1.4rem; font-weight:400; color:#fff; letter-spacing:-.015em; margin:0; }
    .footer-divider { border:0; height:1px; background:rgba(255,255,255,.2); margin:1.6rem 0; width:100%; }
    .footer-bottom { display:flex; justify-content:space-between; align-items:center; width:100%; padding:0 5px; }
    .footer-socials { display:flex; gap:1.25rem; align-items:center; flex:1; }
    .social-icon { color:rgba(255,255,255,.55); transition:all .3s cubic-bezier(.16,1,.3,1); display:inline-flex; align-items:center; justify-content:center; min-width:24px; min-height:24px; text-decoration:none; }
    .social-icon:hover { color:#fff; transform:translateY(-2px); }
    .footer-links { display:flex; gap:2.8rem; justify-content:center; align-items:center; flex:2; }
    .footer-link { font-family:Outfit,sans-serif; font-size:.95rem; font-weight:400; color:#fff; text-decoration:none; letter-spacing:.03em; transition:opacity .3s ease, transform .3s ease; }
    .footer-link:hover { opacity:.75; transform:translateY(-1px); }
    .footer-copyright { font-family:Outfit,sans-serif; font-size:.95rem; font-weight:400; color:rgba(255,255,255,.45); text-align:right; flex:1; letter-spacing:.02em; }
    .footer-logo-wrap { position:fixed; bottom:20px; left:0; right:0; width:100%; padding:0 20px; display:flex; justify-content:center; align-items:center; z-index:3; margin:0; }
    .footer-logo-text { font-family:'General Sans',-apple-system,sans-serif; font-size:21.9vw; font-weight:400; color:#fff; letter-spacing:-.03em; margin-right:-.03em; transform:translateX(-20px); line-height:.8; margin-top:0; margin-bottom:0; margin-left:0; text-align:center; width:100%; pointer-events:none; opacity:.95; text-shadow:none; white-space:nowrap; }
    .video-container { position:fixed; bottom:0; left:0; width:100vw; height:90vh; overflow:hidden; z-index:-1; }
    #bg-video { width:100%; height:110%; object-fit:cover; display:block; transform:translateY(0); }
    .glass-cursor-card { position:fixed; top:0; left:0; z-index:99999; pointer-events:none; padding:.75rem 1.5rem; background:rgba(255,255,255,.08); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.18); border-radius:9999px; box-shadow:inset 0 1px 0 rgba(255,255,255,.15); transform:translate(-50%,-50%) scale(0); opacity:0; will-change:transform,opacity; transition:opacity .4s cubic-bezier(.16,1,.3,1),background .35s cubic-bezier(.16,1,.3,1),border-color .35s cubic-bezier(.16,1,.3,1),box-shadow .35s cubic-bezier(.16,1,.3,1); }
    .glass-cursor-card.active, .cursor-ring-outline.active { opacity:1; }
    .cursor-card-text { font-family:'General Sans',-apple-system,sans-serif; font-size:.85rem; font-weight:500; letter-spacing:.06em; color:#39FF14; text-transform:uppercase; white-space:nowrap; text-shadow:0 0 8px rgba(57,255,20,.45); }
    .cursor-card-text .text-white { color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.25); }
    .cursor-ring-outline { position:fixed; top:0; left:0; width:48px; height:48px; border:1.5px solid rgba(255,255,255,.45); border-radius:50%; z-index:99998; pointer-events:none; transform:translate(-50%,-50%) scale(0); opacity:0; will-change:transform,opacity; transition:opacity .4s cubic-bezier(.16,1,.3,1),border-color .4s ease; }
    .cursor-ring-outline.expanded { border-color:rgba(255,255,255,.15); }
    .hero-title .word-wrapper { display:inline-block; overflow:hidden; vertical-align:bottom; padding-bottom:.15em; margin-bottom:-.15em; }
    .hero-title .word-inner { display:inline-block; opacity:0; transform:translateY(105%); filter:blur(20px); animation:word-reveal-mask 1.3s cubic-bezier(.05,.9,.1,1) forwards; }
    @keyframes word-reveal-mask { 0% { opacity:0; transform:translateY(105%); filter:blur(20px); } 30% { opacity:1; } 100% { opacity:1; transform:translateY(0); filter:blur(0); } }
    .footer-logo-text .letter-wrapper { display:inline-block; overflow:hidden; vertical-align:bottom; line-height:.8; }
    .footer-logo-text .letter-inner { display:inline-block; opacity:0; transform:translateX(-105%); filter:blur(20px); animation:letter-reveal-mask 1.2s cubic-bezier(.05,.9,.1,1) forwards; }
    @keyframes letter-reveal-mask { 0% { opacity:0; transform:translateX(-105%); filter:blur(20px); } 25% { opacity:1; } 100% { opacity:.95; transform:translateX(0); filter:blur(0); } }
    @media (max-width:700px) { .hero-content { padding-top:5vh; } .hero-title { font-size:clamp(2rem,8.7vw,2.8rem); margin-bottom:1.5rem; } .hero-btn { font-size:1rem; padding:1rem 1.8rem; } .footer-container { top:auto; bottom:18vh; transform:none; left:16px; right:16px; width:calc(100vw - 32px); } .footer-title { font-size:1.05rem; } .footer-divider { margin:1rem 0; } .footer-bottom { align-items:flex-start; gap:1rem; } .footer-links { gap:.85rem; flex-wrap:wrap; justify-content:flex-end; } .footer-link, .footer-copyright { font-size:.78rem; } .footer-copyright { display:none; } .footer-logo-wrap { bottom:14px; padding:0 12px; } .footer-logo-text { font-size:22.1vw; transform:translateX(-10px); } }
    @media (hover:none), (pointer:coarse) { .glass-cursor-card, .cursor-ring-outline { display:none; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important; } .hero-title .word-inner,.footer-logo-text .letter-inner { opacity:1; transform:none; filter:none; } }
  </style>
</head>
<body>
  <img src="https://api.getlayers.ai/storage/v1/object/public/public/assets/loopstack-f8c64439bf/black_gradient.svg" alt="Top Gradient" id="top-gradient">
  <main class="hero-content">
    <h1 class="hero-title">Apply Now to be part <br> of the closed beta</h1>
    <button class="hero-btn" type="button"><span class="btn-text">Book a demo</span><span class="blinking-dot" aria-hidden="true"></span></button>
  </main>
  <footer class="footer-container">
    <div class="footer-top"><h2 class="footer-title">Stay in Touch</h2><h2 class="footer-title quote">Think. Build. Repeat.</h2></div>
    <hr class="footer-divider">
    <div class="footer-bottom">
      <div class="footer-socials">
        <a href="#" aria-label="LinkedIn" class="social-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg></a>
        <a href="#" aria-label="X" class="social-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l11.733 16h4.267l-11.733 -16z"></path><path d="M4 20l6.768 -6.768m2.46 -2.46l6.772 -6.772"></path></svg></a>
        <a href="#" aria-label="Instagram" class="social-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></a>
      </div>
      <nav class="footer-links" aria-label="Footer navigation"><a href="#about" class="footer-link">About</a><a href="#features" class="footer-link">Features</a><a href="#pricing" class="footer-link">Pricing</a><a href="#contact" class="footer-link">Contact</a></nav>
      <div class="footer-copyright">© 2026 Loopstack</div>
    </div>
  </footer>
  <div class="footer-logo-wrap"><h2 class="footer-logo-text">Loopstack</h2></div>
  <div class="video-container"><video autoplay muted playsinline loop id="bg-video"><source src="https://api.getlayers.ai/storage/v1/object/public/public/assets/loopstack-f8c64439bf/flower.mp4" type="video/mp4">Ваш браузер не поддерживает видео.</video></div>
  <div id="cursor-ring" class="cursor-ring-outline"></div>
  <div id="glass-card" class="glass-cursor-card"><span class="cursor-card-text"><span class="text-white">Say</span> Hello!</span></div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const logoText = document.querySelector('.footer-logo-text');
      if (logoText) { const text = logoText.textContent.trim(); logoText.innerHTML = ''; [...text].forEach((char, index) => { const wrapper = document.createElement('span'); wrapper.className = 'letter-wrapper'; const inner = document.createElement('span'); inner.textContent = char === ' ' ? '\u00a0' : char; inner.className = 'letter-inner'; inner.style.animationDelay = `${index * .09}s`; wrapper.appendChild(inner); logoText.appendChild(wrapper); }); }
      const heroTitle = document.querySelector('.hero-title');
      if (heroTitle) { const parts = heroTitle.innerHTML.split(/(\s+|<br\s*\/?>)/i); heroTitle.innerHTML = ''; let wordIndex = 0; parts.forEach(part => { if (part.trim() === '') heroTitle.appendChild(document.createTextNode(' ')); else if (part.toLowerCase().startsWith('<br')) heroTitle.appendChild(document.createElement('br')); else { const wrapper = document.createElement('span'); wrapper.className = 'word-wrapper'; const inner = document.createElement('span'); inner.className = 'word-inner'; inner.textContent = part; inner.style.animationDelay = `${wordIndex++ * .1}s`; wrapper.appendChild(inner); heroTitle.appendChild(wrapper); } }); }
      if (matchMedia('(hover: hover) and (pointer: fine)').matches && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const glassCard = document.getElementById('glass-card'), cursorRing = document.getElementById('cursor-ring'); let mouseX = innerWidth / 2, mouseY = innerHeight / 2, cardX = mouseX, cardY = mouseY, scale = 0, targetScale = 0, firstMove = true, hovering = false;
        document.addEventListener('mousemove', e => { mouseX=e.clientX; mouseY=e.clientY; if(firstMove){ cardX=mouseX; cardY=mouseY; firstMove=false; glassCard.classList.add('active'); cursorRing.classList.add('active'); } if(!hovering) targetScale=1; });
        document.addEventListener('mouseleave', () => targetScale=0); document.addEventListener('mouseenter', () => { if(!hovering) targetScale=1; });
        const btn=document.querySelector('.hero-btn'); btn.addEventListener('mouseenter',()=>{ hovering=true; targetScale=0; cursorRing.classList.add('expanded'); }); btn.addEventListener('mouseleave',()=>{ hovering=false; targetScale=1; cursorRing.classList.remove('expanded'); });
        const animate=()=>{ cardX+=(mouseX-cardX)*.08; cardY+=(mouseY-cardY)*.08; scale+=(targetScale-scale)*.15; const ringScale=(cursorRing.classList.contains('expanded')?1.6:1)*scale; glassCard.style.transform=`translate3d(${cardX}px,${cardY}px,0) translate(-50%,-50%) scale(${scale})`; cursorRing.style.transform=`translate3d(${mouseX}px,${mouseY}px,0) translate(-50%,-50%) scale(${ringScale})`; requestAnimationFrame(animate); }; animate();
      }
    });
  </script>
</body>
</html>
